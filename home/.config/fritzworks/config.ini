# Personal overrides; the npm package ships neutral defaults.
[paths]
data = ~/.local/share/ws
repositories = ~/github
worktrees = ~/github/worktrees
scratchpads = ~/scratchpad
sessionNotes = ~/notes/work/2026/workstream

[commands]
shell = zsh
editor = nvim

[locations.notes]
repo = fritzy/notes
path = ~/notes

[locations.dotfiles]
repo = fritzy/dotfiles
path = ~/dotfiles

[suggestions.linear]
enabled = true
team = ECO

[suggestions.github]
enabled = true
issueRepository = chainguard-dev/customer-issues
issueLabel = eng:ecosystems:javascript
reviewRepositories = ["chainguard-dev/mono", "chainguard-dev/ecosystems-rebuilder.js"]
teammates = ["indexzero", "jumoel", "dakaneye"]
