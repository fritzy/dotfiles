<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scheduled tasks · Clock icons</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 24px; background: #ecefeb; color: #202921; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 960px; margin: auto; }
    h1 { margin: 0; font-size: 32px; font-weight: 550; letter-spacing: -1px; }
    .intro { margin: 8px 0 32px; color: #626b63; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    article { overflow: hidden; border: 1px solid #d5dbd3; border-radius: 18px; background: #fff; }
    .face { display: grid; place-items: center; height: 180px; background: #f8faf6; }
    .face svg { width: 80px; height: 80px; }
    .details { padding: 24px; }
    h2 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
    .description { margin: 0 0 24px; min-height: 45px; color: #626b63; font-size: 14px; }
    .sizes { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .sample { display: grid; justify-items: center; gap: 12px; color: #626b63; font-size: 11px; }
    .sample svg { color: #202921; }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 24px; padding: 14px; border-radius: 10px; background: #f0f3ed; font-size: 14px; }
    .row svg { width: 20px; height: 20px; flex: none; }
    .dark { margin-top: 12px; background: #202921; color: #eef4e9; }
    a { display: inline-block; margin-top: 22px; color: #356444; font-size: 13px; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Scheduled tasks</h1>
    <p class="intro">Three analog clocks. Previewed at 16, 20, 24, and 32 pixels.</p>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const variants = [
      { name: 'Outline', file: 'clock-outline.svg', description: 'A quiet, minimal clock for everyday navigation.', markup: '<circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2"/>' },
      { name: 'Dial', file: 'clock-dial.svg', description: 'Four hour marks give the face a familiar analog feel.', markup: '<circle cx="12" cy="12" r="9"/><path d="M12 5.5V6m6 6h.5M12 18v.5M5.5 12H6M12 8v4l3 1.75"/>' },
      { name: 'Solid', file: 'clock-solid.svg', description: 'A stronger silhouette for a selected or active state.', markup: '<path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm.875 4.5a.875.875 0 0 0-1.75 0V12c0 .314.168.604.44.76l3.5 2a.875.875 0 1 0 .87-1.52l-3.06-1.748V6.5Z"/>' },
    ];
    function icon(variant, size = 24) {
      const style = variant.name === 'Solid' ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"';
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true" ${style}>${variant.markup}</svg>`;
    }
    document.getElementById('grid').innerHTML = variants.map(variant => `
      <article>
        <div class="face">${icon(variant, 80)}</div>
        <div class="details">
          <h2>${variant.name}</h2>
          <p class="description">${variant.description}</p>
          <div class="sizes">${[16, 20, 24, 32].map(size => `<div class="sample">${icon(variant, size)}<span>${size} px</span></div>`).join('')}</div>
          <div class="row">${icon(variant)}<span>Scheduled tasks</span></div>
          <div class="row dark">${icon(variant)}<span>Scheduled tasks</span></div>
          <a href="${variant.file}" download>Download SVG</a>
        </div>
      </article>`).join('');
  </script>
</body>
</html>
