# Default configuration for @fritzy/fritzworks.
#
# Do not edit the installed copy. Override only the settings you want in:
#   $XDG_CONFIG_HOME/fritzworks/config.ini
# or, when XDG_CONFIG_HOME is unset:
#   ~/.config/fritzworks/config.ini

configVersion = 2
agent = claude
gitProtocol = ssh

[paths]
data = ${XDG_DATA_HOME}/fritzworks
# Managed roots default to separate subdirectories of paths.data.

[notes.weekly]
enabled = false

[commands]
shell = /bin/sh
editor = vi
claude = claude
codex = codex

[models.claude]
default = opus
scratch = sonnet

[models.codex]
default =
scratch =

[server]
host = 127.0.0.1
port = 7337
pollInterval = 1000

[suggestions.linear]
enabled = false

[suggestions.github]
enabled = false
