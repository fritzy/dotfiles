# Default configuration for @fritzy/ai-workstream.
#
# Do not edit the installed copy. Override only the settings you want in:
#   $XDG_CONFIG_HOME/ai-workstream/config.ini
# or, when XDG_CONFIG_HOME is unset:
#   ~/.config/ai-workstream/config.ini

panels = shell, editor, agent
agent = claude
zellijSession = ws
gitProtocol = ssh

[paths]
repositories = ~/github
scratchpads = ~/scratchpad
notes = ~/notes
dotfiles = ~/dotfiles
data = ${XDG_DATA_HOME}/ws

[commands]
shell = zsh
editor = nvim
claude = claude
codex = codex

[models.claude]
default = opus
scratch = sonnet

[models.codex]
default =
scratch =
