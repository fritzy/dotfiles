# Default configuration for @fritzy/ai-workstream.
#
# Do not edit the installed copy. Override only the settings you want in:
#   $XDG_CONFIG_HOME/ai-workstream/config.ini
# or, when XDG_CONFIG_HOME is unset:
#   ~/.config/ai-workstream/config.ini

panels = shell, editor, agent
agent = claude
zellijSession = ws
gitProtocol = ssh

[paths]
repositories = ~/github
scratchpads = ~/scratchpad
data = ${XDG_DATA_HOME}/ws

[locations.notes]
repo = fritzy/notes
path = /home/nathan.fritz/notes/
weeklyNotes = true

[locations.dotfiles]
repo = fritzy/dotfiles
path = /home/nathan.fritz/dotfiles/

[commands]
shell = zsh
editor = nvim
claude = claude
codex = codex

[models.claude]
default = opus
scratch = sonnet

[models.codex]
default =
scratch =

[server]
host = 127.0.0.1
port = 7337
pollInterval = 1000
